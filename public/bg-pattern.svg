<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Scattered music notes pattern tile -->
  <g fill="#c7d7f5" opacity="0.5">
    <!-- Treble clef -->
    <text x="30" y="45" font-family="serif" font-size="28" transform="rotate(-15 30 45)">𝄞</text>

    <!-- Quarter note -->
    <ellipse cx="140" cy="30" rx="6" ry="4.5" transform="rotate(-20 140 30)"/>
    <line x1="146" y1="29" x2="146" y2="10" stroke="#c7d7f5" stroke-width="2"/>

    <!-- Eighth note -->
    <ellipse cx="85" cy="95" rx="5" ry="3.8" transform="rotate(-10 85 95)"/>
    <line x1="90" y1="94" x2="90" y2="76" stroke="#c7d7f5" stroke-width="1.8"/>
    <path d="M 90 76 Q 97 80 95 85" fill="none" stroke="#c7d7f5" stroke-width="1.8"/>

    <!-- Double eighth notes -->
    <ellipse cx="160" cy="130" rx="5" ry="3.5" transform="rotate(-15 160 130)"/>
    <ellipse cx="175" cy="133" rx="5" ry="3.5" transform="rotate(-15 175 133)"/>
    <line x1="165" y1="129" x2="165" y2="110" stroke="#c7d7f5" stroke-width="1.8"/>
    <line x1="180" y1="132" x2="180" y2="113" stroke="#c7d7f5" stroke-width="1.8"/>
    <line x1="165" y1="110" x2="180" y2="113" stroke="#c7d7f5" stroke-width="2"/>

    <!-- Quarter note -->
    <ellipse cx="35" cy="150" rx="5.5" ry="4" transform="rotate(-25 35 150)"/>
    <line x1="40.5" y1="149" x2="40.5" y2="128" stroke="#c7d7f5" stroke-width="1.8"/>

    <!-- Small treble clef -->
    <text x="110" y="175" font-family="serif" font-size="22" transform="rotate(10 110 175)">𝄞</text>

    <!-- Sixteenth note -->
    <ellipse cx="55" cy="85" rx="4.5" ry="3.2" transform="rotate(-5 55 85)"/>
    <line x1="59.5" y1="84" x2="59.5" y2="65" stroke="#c7d7f5" stroke-width="1.5"/>
    <path d="M 59.5 65 Q 66 68 64 72" fill="none" stroke="#c7d7f5" stroke-width="1.5"/>
    <path d="M 59.5 69 Q 66 72 64 76" fill="none" stroke="#c7d7f5" stroke-width="1.3"/>

    <!-- Half note -->
    <ellipse cx="145" cy="185" rx="5.5" ry="4" transform="rotate(-20 145 185)" fill="none" stroke="#c7d7f5" stroke-width="1.8"/>
    <line x1="150.5" y1="184" x2="150.5" y2="164" stroke="#c7d7f5" stroke-width="1.8"/>

    <!-- Whole note -->
    <ellipse cx="20" cy="195" rx="6" ry="4" transform="rotate(-10 20 195)" fill="none" stroke="#c7d7f5" stroke-width="1.5"/>
  </g>
</svg>
