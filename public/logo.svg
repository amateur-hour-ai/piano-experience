<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120">
  <!-- Grand Piano - Side/diagonal perspective -->
  <!-- Piano body (curved side profile) -->
  <path d="M 20 75 C 20 55, 35 35, 75 30 C 100 27, 115 35, 118 50 L 118 78 C 118 82, 115 85, 110 85 L 25 85 C 22 85, 20 82, 20 78 Z" fill="#1a1a1a" stroke="#333" stroke-width="1"/>

  <!-- Piano lid (open, angled back) -->
  <path d="M 20 75 C 20 55, 35 35, 75 30 C 100 27, 115 35, 118 50" fill="none" stroke="#444" stroke-width="1.5"/>
  <path d="M 75 30 C 100 27, 115 35, 118 50 L 120 28 C 117 15, 102 8, 78 12 Z" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <!-- Lid prop stick -->
  <line x1="105" y1="48" x2="112" y2="22" stroke="#555" stroke-width="1.5"/>

  <!-- Keyboard area (front face) -->
  <rect x="20" y="75" width="98" height="10" rx="1" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <!-- White keys -->
  <rect x="22" y="76" width="94" height="7" rx="0.5" fill="#f5f5f5"/>
  <!-- Black keys -->
  <rect x="30" y="76" width="3" height="4.5" rx="0.3" fill="#1a1a1a"/>
  <rect x="37" y="76" width="3" height="4.5" rx="0.3" fill="#1a1a1a"/>
  <rect x="48" y="76" width="3" height="4.5" rx="0.3" fill="#1a1a1a"/>
  <rect x="55" y="76" width="3" height="4.5" rx="0.3" fill="#1a1a1a"/>
  <rect x="62" y="76" width="3" height="4.5" rx="0.3" fill="#1a1a1a"/>
  <rect x="73" y="76" width="3" height="4.5" rx="0.3" fill="#1a1a1a"/>
  <rect x="80" y="76" width="3" height="4.5" rx="0.3" fill="#1a1a1a"/>
  <rect x="91" y="76" width="3" height="4.5" rx="0.3" fill="#1a1a1a"/>
  <rect x="98" y="76" width="3" height="4.5" rx="0.3" fill="#1a1a1a"/>
  <rect x="105" y="76" width="3" height="4.5" rx="0.3" fill="#1a1a1a"/>

  <!-- Piano legs -->
  <rect x="24" y="85" width="4" height="18" rx="1" fill="#1a1a1a"/>
  <rect x="24" y="101" width="6" height="3" rx="1" fill="#1a1a1a"/>
  <rect x="65" y="85" width="4" height="18" rx="1" fill="#1a1a1a"/>
  <rect x="65" y="101" width="6" height="3" rx="1" fill="#1a1a1a"/>
  <rect x="110" y="85" width="4" height="18" rx="1" fill="#1a1a1a"/>
  <rect x="110" y="101" width="6" height="3" rx="1" fill="#1a1a1a"/>

  <!-- Pedals -->
  <rect x="60" y="103" width="3" height="4" rx="0.5" fill="#555"/>
  <rect x="66" y="103" width="3" height="4" rx="0.5" fill="#555"/>
  <rect x="72" y="103" width="3" height="4" rx="0.5" fill="#555"/>

  <!-- Music notes floating out from the open lid -->
  <g fill="#2563eb" opacity="0.85">
    <!-- Eighth note 1 -->
    <ellipse cx="108" cy="18" rx="4" ry="3" transform="rotate(-20 108 18)"/>
    <line x1="112" y1="18" x2="112" y2="4" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M 112 4 Q 118 6 116 10" fill="none" stroke="#2563eb" stroke-width="1.5"/>

    <!-- Quarter note 2 -->
    <ellipse cx="125" cy="10" rx="3.5" ry="2.5" transform="rotate(-15 125 10)"/>
    <line x1="128.5" y1="10" x2="128.5" y2="-2" stroke="#2563eb" stroke-width="1.5"/>

    <!-- Eighth note 3 -->
    <ellipse cx="118" cy="30" rx="3" ry="2.2" transform="rotate(-10 118 30)"/>
    <line x1="121" y1="30" x2="121" y2="18" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M 121 18 Q 126 20 124 23" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  </g>

  <!-- Sparkle dots -->
  <circle cx="132" cy="5" r="1.5" fill="#2563eb" opacity="0.5"/>
  <circle cx="130" cy="22" r="1" fill="#2563eb" opacity="0.4"/>
  <circle cx="105" cy="8" r="1" fill="#2563eb" opacity="0.3"/>
</svg>
