<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <!-- Grand Piano - 3/4 diagonal view from left side -->

  <!-- Piano body - the distinctive curved shape of a grand piano seen from the side -->
  <!-- Back curve (the long curved side) -->
  <path d="M 30 68 C 30 45, 50 28, 85 24 C 105 22, 120 28, 125 40 L 125 72 L 30 72 Z" fill="#1a1a1a"/>
  <!-- Top surface with slight perspective -->
  <path d="M 30 68 C 30 45, 50 28, 85 24 C 105 22, 120 28, 125 40 L 128 38 C 123 25, 107 19, 87 21 C 52 25, 32 42, 32 65 Z" fill="#2d2d2d"/>

  <!-- Open lid - propped up at an angle -->
  <path d="M 87 21 C 107 19, 123 25, 128 38 L 132 14 C 127 4, 110 -1, 92 1 Z" fill="#333" stroke="#444" stroke-width="0.5"/>
  <!-- Lid prop stick -->
  <line x1="118" y1="38" x2="126" y2="10" stroke="#666" stroke-width="1.2"/>

  <!-- Front panel (where keyboard is) -->
  <rect x="28" y="68" width="99" height="8" rx="1" fill="#222"/>

  <!-- Keyboard -->
  <rect x="30" y="69" width="95" height="6" rx="0.5" fill="#f0f0f0"/>
  <!-- Black keys with proper spacing for piano octaves -->
  <rect x="37" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="43" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="53" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="59" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="65" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="75" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="81" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="91" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="97" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="103" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="113" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>
  <rect x="119" y="69" width="2.5" height="3.8" rx="0.3" fill="#111"/>

  <!-- Music desk (the small shelf for sheet music) -->
  <rect x="55" y="64" width="40" height="4" rx="0.5" fill="#2a2a2a" stroke="#444" stroke-width="0.3"/>

  <!-- Three piano legs with casters -->
  <!-- Front left leg -->
  <path d="M 34 76 L 34 76 C 34 76, 33 76, 33 78 L 31 102 C 31 104, 32 105, 34 105 L 36 105 C 38 105, 39 104, 39 102 L 37 78 C 37 76, 36 76, 34 76" fill="#1a1a1a"/>
  <ellipse cx="35" cy="106" rx="3" ry="1.5" fill="#333"/>

  <!-- Front right leg -->
  <path d="M 121 76 L 121 76 C 121 76, 120 76, 120 78 L 118 102 C 118 104, 119 105, 121 105 L 123 105 C 125 105, 126 104, 126 102 L 124 78 C 124 76, 123 76, 121 76" fill="#1a1a1a"/>
  <ellipse cx="122" cy="106" rx="3" ry="1.5" fill="#333"/>

  <!-- Back leg (centered under curve) -->
  <path d="M 78 76 L 78 76 C 78 76, 77 76, 77 78 L 75 102 C 75 104, 76 105, 78 105 L 80 105 C 82 105, 83 104, 83 102 L 81 78 C 81 76, 80 76, 78 76" fill="#1a1a1a"/>
  <ellipse cx="79" cy="106" rx="3" ry="1.5" fill="#333"/>

  <!-- Pedals -->
  <rect x="72" y="105" width="3" height="4" rx="0.5" fill="#555"/>
  <rect x="77" y="105" width="3" height="4" rx="0.5" fill="#555"/>
  <rect x="82" y="105" width="3" height="4" rx="0.5" fill="#555"/>

  <!-- Music notes floating from the open lid -->
  <g fill="#2563eb" opacity="0.85">
    <!-- Eighth note -->
    <ellipse cx="130" cy="14" rx="4" ry="2.8" transform="rotate(-20 130 14)"/>
    <line x1="134" y1="13" x2="134" y2="0" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M 134 0 Q 140 3 138 7" fill="none" stroke="#2563eb" stroke-width="1.5"/>

    <!-- Quarter note -->
    <ellipse cx="145" cy="8" rx="3.5" ry="2.5" transform="rotate(-15 145 8)"/>
    <line x1="148.5" y1="7" x2="148.5" y2="-4" stroke="#2563eb" stroke-width="1.5"/>

    <!-- Sixteenth note pair -->
    <ellipse cx="140" cy="26" rx="3" ry="2.2" transform="rotate(-10 140 26)"/>
    <line x1="143" y1="25" x2="143" y2="14" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M 143 14 Q 148 16 146 19" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M 143 17 Q 148 19 146 22" fill="none" stroke="#2563eb" stroke-width="1.2"/>
  </g>

  <!-- Sparkles -->
  <circle cx="152" cy="2" r="1.5" fill="#2563eb" opacity="0.4"/>
  <circle cx="150" cy="18" r="1" fill="#2563eb" opacity="0.3"/>
  <circle cx="135" cy="32" r="1.2" fill="#2563eb" opacity="0.35"/>
</svg>
