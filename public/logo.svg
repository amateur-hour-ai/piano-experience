<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <!-- Clean side-view grand piano silhouette -->

  <!-- Main body silhouette - the iconic grand piano profile -->
  <!-- This traces the recognizable outline: flat keyboard side, curved back -->
  <path d="
    M 25 82
    L 25 58
    L 135 58
    L 135 48
    C 135 35, 125 25, 108 22
    C 90 19, 65 22, 45 30
    C 32 36, 25 44, 25 55
    Z
  " fill="#1a1a1a"/>

  <!-- Open lid - the distinctive propped-open lid -->
  <path d="
    M 135 48
    C 135 35, 125 25, 108 22
    C 90 19, 65 22, 45 30
    L 42 18
    C 62 10, 88 7, 108 10
    C 128 13, 140 24, 140 38
    Z
  " fill="#2a2a2a" stroke="#444" stroke-width="0.8"/>

  <!-- Lid prop stick -->
  <line x1="128" y1="45" x2="136" y2="24" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Keyboard - white keys visible from the side -->
  <rect x="25" y="58" width="110" height="8" fill="#f5f5f0" rx="0.5"/>

  <!-- Black keys -->
  <rect x="34" y="58" width="3" height="5" fill="#111" rx="0.3"/>
  <rect x="42" y="58" width="3" height="5" fill="#111" rx="0.3"/>
  <rect x="54" y="58" width="3" height="5" fill="#111" rx="0.3"/>
  <rect x="62" y="58" width="3" height="5" fill="#111" rx="0.3"/>
  <rect x="70" y="58" width="3" height="5" fill="#111" rx="0.3"/>
  <rect x="82" y="58" width="3" height="5" fill="#111" rx="0.3"/>
  <rect x="90" y="58" width="3" height="5" fill="#111" rx="0.3"/>
  <rect x="102" y="58" width="3" height="5" fill="#111" rx="0.3"/>
  <rect x="110" y="58" width="3" height="5" fill="#111" rx="0.3"/>
  <rect x="118" y="58" width="3" height="5" fill="#111" rx="0.3"/>
  <rect x="128" y="58" width="3" height="5" fill="#111" rx="0.3"/>

  <!-- Bottom edge of piano body -->
  <rect x="25" y="66" width="110" height="16" fill="#1a1a1a" rx="1"/>

  <!-- Three legs -->
  <!-- Left front leg -->
  <rect x="30" y="82" width="5" height="28" rx="1.5" fill="#1a1a1a"/>
  <ellipse cx="32.5" cy="111" rx="4" ry="2" fill="#333"/>

  <!-- Right front leg -->
  <rect x="128" y="82" width="5" height="28" rx="1.5" fill="#1a1a1a"/>
  <ellipse cx="130.5" cy="111" rx="4" ry="2" fill="#333"/>

  <!-- Back center leg -->
  <rect x="75" y="82" width="5" height="28" rx="1.5" fill="#1a1a1a"/>
  <ellipse cx="77.5" cy="111" rx="4" ry="2" fill="#333"/>

  <!-- Three pedals -->
  <rect x="69" y="110" width="4" height="5" rx="1" fill="#555"/>
  <rect x="76" y="110" width="4" height="5" rx="1" fill="#555"/>
  <rect x="83" y="110" width="4" height="5" rx="1" fill="#555"/>

  <!-- Music notes floating up from the open lid -->
  <g fill="#2563eb">
    <!-- Note 1 - eighth note -->
    <ellipse cx="148" cy="22" rx="5" ry="3.5" transform="rotate(-20 148 22)" opacity="0.9"/>
    <line x1="153" y1="21" x2="153" y2="5" stroke="#2563eb" stroke-width="2" opacity="0.9"/>
    <path d="M 153 5 Q 160 8 158 13" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.9"/>

    <!-- Note 2 - quarter note -->
    <ellipse cx="168" cy="12" rx="4.5" ry="3" transform="rotate(-15 168 12)" opacity="0.7"/>
    <line x1="172.5" y1="11" x2="172.5" y2="-3" stroke="#2563eb" stroke-width="2" opacity="0.7"/>

    <!-- Note 3 - eighth note -->
    <ellipse cx="158" cy="38" rx="4" ry="2.8" transform="rotate(-10 158 38)" opacity="0.6"/>
    <line x1="162" y1="37" x2="162" y2="23" stroke="#2563eb" stroke-width="1.8" opacity="0.6"/>
    <path d="M 162 23 Q 168 26 166 30" fill="none" stroke="#2563eb" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Small sparkle dots -->
  <circle cx="178" cy="5" r="2" fill="#2563eb" opacity="0.4"/>
  <circle cx="175" cy="28" r="1.5" fill="#2563eb" opacity="0.3"/>
  <circle cx="148" cy="44" r="1.5" fill="#2563eb" opacity="0.25"/>
</svg>
